name: dim_customer
domain: Vijay Domain
description: Customer dimension cube - tracks customer account information
snowflake_table: vijay_db.banking.dim_customer

columns:
  - name: customer_id
    type: string
    description: Unique customer identifier
    mapped_to: customer_id

  - name: customer_name
    type: string
    description: Full name of the customer
    mapped_to: customer_name

  - name: total_balance
    type: number
    description: Total balance across all accounts
    mapped_to: balance

  - name: loyalty_score
    type: number
    description: Customer loyalty score
    mapped_to: loyalty_score

  - name: credit_score
    type: number
    description: Customer credit score
    mapped_to: credit_score

  - name: region
    type: string
    description: Customer region
    mapped_to: region
