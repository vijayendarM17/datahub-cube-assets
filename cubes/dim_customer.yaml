name: dim_customer
domain: Vijay Domain
description: Customer dimension cube - tracks customer account, loyalty metrics and risk
snowflake_table: vijay_db.banking.dim_customer

columns:
  - name: customer_id
    type: string
    description: Unique customer identifier
    mapped_to: customer_id

  - name: customer_name
    type: string
    description: Full name of the customer
    mapped_to: customer_name

  - name: account_balance
    type: number
    description: Total balance across all accounts
    mapped_to: balance
    renamed_from: total_balance

  - name: email
    type: string
    description: Customer email address
    mapped_to: email

  - name: loyalty_score
    type: number
    description: Customer loyalty score
    mapped_to: loyalty_score

  - name: credit_score
    type: number
    description: Customer credit score
    mapped_to: credit_score

  - name: region
    type: string
    description: Customer region
    mapped_to: region

  - name: customer_tier
    type: string
    description: Customer tier classification (e.g. Gold, Silver, Bronze)
    mapped_to: customer_tier

  - name: last_login_date
    type: date
    description: Date of the customer's most recent login
    mapped_to: last_login_date

  - name: risk_category
    type: string
    description: Customer risk category (Low, Medium, High)
    mapped_to: risk_category
